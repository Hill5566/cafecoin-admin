<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CafeCoin 平台後台</title>
<style>
  :root{
    --bg:#f6f4f1; --card:#fff; --ink:#241f1a; --muted:#8a7f6f;
    --accent:#a3806a; --line:#e7e1d9; --ok:#2f855a; --bad:#c05621; --pend:#b7791f;
    color-scheme:light;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:16px/1.6 -apple-system,"PingFang TC","Noto Sans TC",sans-serif}
  header{position:sticky;top:0;background:rgba(246,244,241,.9);backdrop-filter:blur(8px);
         border-bottom:1px solid var(--line);padding:14px 20px;display:flex;
         align-items:center;justify-content:space-between;z-index:5}
  header h1{font-size:1.05rem;margin:0;color:var(--accent);font-weight:700}
  .wrap{max-width:760px;margin:0 auto;padding:20px 16px 64px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
        padding:16px;margin-bottom:12px}
  h2{font-size:.85rem;letter-spacing:.05em;color:var(--muted);text-transform:uppercase;
     margin:22px 4px 10px}
  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .title{font-weight:600}
  .sub{font-size:.85rem;color:var(--muted)}
  .pill{font-size:.72rem;padding:2px 9px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
  .pill.owner{color:var(--accent);border-color:var(--accent)}
  .pill.approved{color:var(--ok)} .pill.pending{color:var(--pend);border-color:var(--pend)}
  .pill.revoked{color:var(--bad)}
  button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--accent);
         background:var(--accent);color:#fff;padding:9px 16px;font-weight:600}
  button.ghost{background:transparent;color:var(--accent)}
  button.sm{padding:5px 12px;font-size:.85rem}
  button.danger{border-color:var(--bad);color:var(--bad);background:transparent}
  button:disabled{opacity:.5;cursor:default}
  input{font:inherit;width:100%;padding:12px 14px;border:1px solid var(--line);
        border-radius:10px;background:#fff}
  .card input{margin:4px 0 8px}
  .card label{display:block;margin-top:8px;color:var(--muted);font-size:.85rem}
  .staff-list{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
  .staff-list .row{padding:7px 0}
  .empty{color:var(--muted);font-size:.9rem;padding:6px 4px}
  .msg{font-size:.9rem;padding:10px 14px;border-radius:10px;margin:10px 0}
  .msg.err{background:#fdecea;color:#a12} .msg.ok{background:#e9f6ef;color:var(--ok)}
  .center{min-height:70vh;display:flex;flex-direction:column;justify-content:center;
          max-width:380px;margin:0 auto;padding:0 20px}
  .brand{font:700 44px/1 -apple-system,serif;color:var(--accent);margin-bottom:4px}
  .actions{display:flex;gap:8px}
  a.link{color:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://vcbxofxavyaatdzsqkql.supabase.co";
const SUPABASE_KEY = "sb_publishable_iFKkE-exPxV5pVToe6HQLQ_i_h_4lxl";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const app = document.getElementById("app");
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const el = html => { const t=document.createElement("template"); t.innerHTML=html.trim(); return t.content.firstElementChild; };
const statusLabel = s => ({approved:"已核准",pending:"待審核",revoked:"已撤銷"}[s]||s);

async function boot(){
  const { data:{ session } } = await sb.auth.getSession();
  if(!session){ return renderLogin(); }
  const { data:me } = await sb.from("people").select("is_platform_admin,display_name")
    .eq("id", session.user.id).maybeSingle();
  if(!me || !me.is_platform_admin){ return renderNoAccess(session.user.email); }
  renderConsole(session.user, me);
}

/* ---------- 登入 ---------- */
function renderLogin(){
  app.innerHTML = "";
  const box = el(`<div class="center">
    <div class="brand">CafeCoin</div>
    <div class="sub" style="margin-bottom:28px">平台管理後台</div>
    <input id="email" type="email" placeholder="管理員 email" autocomplete="email">
    <input id="pw" type="password" placeholder="密碼" autocomplete="current-password" style="margin-top:10px">
    <button id="login" style="margin-top:12px">登入</button>
    <button id="magic" class="ghost" style="margin-top:8px">改用 Email 連結登入</button>
    <div id="m"></div>
  </div>`);
  app.appendChild(box);
  const email = box.querySelector("#email"), pw = box.querySelector("#pw"), m = box.querySelector("#m"),
        loginBtn = box.querySelector("#login"), magicBtn = box.querySelector("#magic");
  loginBtn.onclick = async () => {
    const addr = email.value.trim();
    if(!addr || !pw.value){ (addr?pw:email).focus(); return; }
    loginBtn.disabled = true; m.innerHTML = "";
    const { error } = await sb.auth.signInWithPassword({ email: addr, password: pw.value });
    loginBtn.disabled = false;
    if(error) m.innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
    // 成功由 onAuthStateChange -> boot() 接手
  };
  pw.addEventListener("keydown", e=>{ if(e.key==="Enter") loginBtn.click(); });
  magicBtn.onclick = async () => {
    const addr = email.value.trim();
    if(!addr){ email.focus(); return; }
    magicBtn.disabled = true; m.innerHTML = "";
    const { error } = await sb.auth.signInWithOtp({
      email: addr, options:{ emailRedirectTo: location.href.split("#")[0] }
    });
    magicBtn.disabled = false;
    m.innerHTML = error
      ? `<div class="msg err">${esc(error.message)}</div>`
      : `<div class="msg ok">登入連結已寄到 ${esc(addr)}。</div>`;
  };
}

function renderNoAccess(email){
  app.innerHTML = "";
  app.appendChild(el(`<div class="center">
    <div class="brand">CafeCoin</div>
    <div class="msg err" style="margin-top:20px">此帳號(${esc(email)})尚無平台管理權限。<br>請聯絡系統管理員開通後再登入。</div>
    <button class="ghost" onclick="signOut()">登出</button>
  </div>`));
}

async function signOut(){ await sb.auth.signOut(); location.reload(); }

/* ---------- 主控台 ---------- */
async function renderConsole(user, me){
  app.innerHTML = `
    <header><h1>CafeCoin 平台後台</h1>
      <button class="ghost sm" onclick="signOut()">登出</button></header>
    <div class="wrap">
      <div class="sub" style="margin:0 4px">登入身分:${esc(me.display_name||user.email)}</div>
      <h2>待審店家申請</h2><div id="apps"></div>
      <h2>店家</h2><div id="shops"></div>
      <h2>App 設定</h2><div id="settings"></div>
    </div>`;
  loadApplications();
  loadShops();
  loadSettings();
}

async function loadApplications(){
  const box = document.getElementById("apps");
  const { data, error } = await sb.from("shop_applications")
    .select("id,cafe_name,contact_name,phone,address,created_at")
    .eq("status","pending").order("created_at");
  if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  if(!data.length){ box.innerHTML = `<div class="card empty">目前沒有待審店家申請</div>`; return; }
  box.innerHTML = "";
  data.forEach(a=>{
    const c = el(`<div class="card">
      <div class="row">
        <div><div class="title">${esc(a.cafe_name)}</div>
          <div class="sub">${esc(a.contact_name)}・${esc(a.phone||"—")}</div>
          <div class="sub">${esc(a.address||"")}</div></div>
        <div class="actions">
          <button class="sm" data-ok>核准</button>
          <button class="sm danger" data-no>駁回</button>
        </div>
      </div><div class="m"></div></div>`);
    const m = c.querySelector(".m");
    c.querySelector("[data-ok]").onclick = ()=>act(c,m,"approve_application",{p_application_id:a.id});
    c.querySelector("[data-no]").onclick = ()=>act(c,m,"reject_application",{p_application_id:a.id});
    box.appendChild(c);
  });
}

async function loadShops(){
  const box = document.getElementById("shops");
  const { data, error } = await sb.rpc("admin_shops_overview");
  if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  if(!data.length){ box.innerHTML = `<div class="card empty">目前沒有店家</div>`; return; }
  box.innerHTML = "";
  data.forEach(s=>{
    const active = s.subscription_status==="active";
    const until = s.subscription_valid_until
      ? new Date(s.subscription_valid_until).toLocaleDateString("zh-TW") : "—";
    const subPill = `<span class="pill ${active?'approved':'revoked'}">訂閱:${esc(s.subscription_status||'無')}</span>`;
    const c = el(`<div class="card">
      <div class="row">
        <div><div class="title">${esc(s.shop_name)}</div>
          <div class="sub">負責人:${esc(s.owner_names||'—')}</div>
          <div class="sub">${subPill}　到期 ${esc(until)}${s.can_export?'　可匯出':''}</div></div>
        <button class="ghost sm" data-staff>員工 ▾</button>
      </div>
      <div class="staff-list" hidden></div></div>`);
    const list = c.querySelector(".staff-list");
    c.querySelector("[data-staff]").onclick = (e)=>{
      if(list.hidden){ list.hidden=false; e.target.textContent="員工 ▴"; loadStaff(s.shop_id, list); }
      else { list.hidden=true; e.target.textContent="員工 ▾"; }
    };
    box.appendChild(c);
  });
}

async function loadStaff(shopId, list){
  list.innerHTML = `<div class="empty">載入中…</div>`;
  const { data, error } = await sb.rpc("admin_shop_staff",{p_shop_id:shopId});
  if(error){ list.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  if(!data.length){ list.innerHTML = `<div class="empty">此店沒有店員</div>`; return; }
  list.innerHTML = "";
  data.forEach(st=>{
    const isOwner = st.role==="owner";
    const roleTag = isOwner ? `<span class="pill owner">負責人</span>` : "";
    const c = el(`<div class="row">
      <div><span class="title">${esc(st.name)}</span> ${roleTag}
        <span class="pill ${st.status}">${statusLabel(st.status)}</span></div>
      <div class="actions"></div></div>`);
    const acts = c.querySelector(".actions");
    if(st.status==="pending" && !isOwner){
      const ok = el(`<button class="sm">核准</button>`);
      const no = el(`<button class="sm danger">拒絕</button>`);
      ok.onclick = ()=>reviewStaff(st.staff_id,true,shopId,list);
      no.onclick = ()=>reviewStaff(st.staff_id,false,shopId,list);
      acts.append(ok,no);
    } else if(st.status==="approved"){
      const rv = el(`<button class="sm danger">${isOwner?"撤銷負責人":"撤銷"}</button>`);
      rv.onclick = ()=>{
        if(isOwner && !confirm(`確定撤銷「${st.name}」的負責人權限?\n(用於盜用處理,之後可恢復)`)) return;
        reviewStaff(st.staff_id,false,shopId,list);
      };
      acts.append(rv);
    } else if(st.status==="revoked"){
      if(st.account_active){
        const rs = el(`<button class="sm">恢復</button>`);
        rs.onclick = ()=>reviewStaff(st.staff_id,true,shopId,list);
        acts.append(rs);
      } else {
        acts.append(el(`<span class="sub">帳號已刪除</span>`));
      }
    }
    list.appendChild(c);
  });
}

async function reviewStaff(staffId, approve, shopId, list){
  list.querySelectorAll("button").forEach(b=>b.disabled=true);
  const { error } = await sb.rpc("review_staff",{p_staff_id:staffId,p_approve:approve});
  if(error){ alert(error.message); list.querySelectorAll("button").forEach(b=>b.disabled=false); return; }
  loadStaff(shopId, list);
}

async function act(card, m, fn, params){
  card.querySelectorAll("button").forEach(b=>b.disabled=true);
  const { error } = await sb.rpc(fn, params);
  if(error){ m.innerHTML = `<div class="msg err">${esc(error.message)}</div>`;
             card.querySelectorAll("button").forEach(b=>b.disabled=false); return; }
  card.style.opacity=".5";
  setTimeout(()=>{ loadApplications(); loadShops(); }, 400);
}

/* ---------- App 設定 ---------- */
async function loadSettings(){
  const box = document.getElementById("settings");
  const { data, error } = await sb.rpc("admin_get_app_settings");
  if(error){ box.innerHTML = `<div class="msg err">${esc(error.message)}</div>`; return; }
  box.innerHTML = "";
  (data.min_versions||[]).forEach(v=>{
    const appName = v.app_key==="staff"?"店員 App":v.app_key==="card"?"會員卡 App":v.app_key;
    const c = el(`<div class="card">
      <div class="title">${esc(appName)} <span class="sub">(${esc(v.app_key)})</span></div>
      <label>最低版本 min(低於此版強制更新)</label><input class="min" value="${esc(v.min_version||'')}">
      <label>最新版本 latest</label><input class="latest" value="${esc(v.latest_version||'')}">
      <label>強更訊息</label><input class="msgv" value="${esc(v.message||'')}">
      <button class="sm" style="margin-top:6px">儲存</button><div class="m"></div></div>`);
    const m = c.querySelector(".m");
    c.querySelector("button").onclick = async (e)=>{
      e.target.disabled = true; m.innerHTML = "";
      const { error } = await sb.rpc("admin_set_min_version",{
        p_app_key:v.app_key,
        p_min_version:c.querySelector(".min").value.trim(),
        p_latest_version:c.querySelector(".latest").value.trim(),
        p_message:c.querySelector(".msgv").value.trim()});
      e.target.disabled = false;
      m.innerHTML = error?`<div class="msg err">${esc(error.message)}</div>`:`<div class="msg ok">已儲存</div>`;
    };
    box.appendChild(c);
  });
  (data.configs||[]).forEach(cfg=>{
    const name = cfg.key==="staff_password_login"?"店員帳號密碼登入":cfg.key;
    const c = el(`<div class="card"><div class="row">
      <div><div class="title">${esc(name)}</div><div class="sub">${esc(cfg.key)}</div></div>
      <button class="sm ${cfg.enabled?'':'ghost'}">${cfg.enabled?'開啟中':'已關閉'}</button>
    </div><div class="m"></div></div>`);
    const btn = c.querySelector("button"), m = c.querySelector(".m");
    btn.onclick = async ()=>{
      btn.disabled = true; m.innerHTML = "";
      const { error } = await sb.rpc("admin_set_config",{p_key:cfg.key,p_enabled:!cfg.enabled});
      if(error){ btn.disabled=false; m.innerHTML=`<div class="msg err">${esc(error.message)}</div>`; return; }
      loadSettings();
    };
    box.appendChild(c);
  });
}

sb.auth.onAuthStateChange((e)=>{ if(e==="SIGNED_IN"||e==="SIGNED_OUT") boot(); });
boot();
</script>
</body>
</html>
